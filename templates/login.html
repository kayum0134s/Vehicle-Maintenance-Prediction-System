<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>VMPS — Login | Vehicle Maintenance Prediction System</title>
<meta name="description" content="AI-powered vehicle maintenance prediction. Login to access your dashboard."/>
<link rel="stylesheet" href="/static/css/style.css"/>
<style>
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(0,212,255,0.06) 0%,transparent 60%),radial-gradient(ellipse at 70% 30%,rgba(139,92,246,0.06) 0%,transparent 60%),var(--gradient-1);}
.login-card{width:440px;padding:40px;position:relative;z-index:1;border-radius:24px;background:rgba(10,15,30,0.85);backdrop-filter:blur(30px);border:1px solid var(--glass-border);box-shadow:0 30px 80px rgba(0,0,0,0.5);}
.login-logo{text-align:center;margin-bottom:32px;}
.login-logo .brand{font-family:'Orbitron',monospace;font-size:1.5rem;font-weight:900;background:linear-gradient(90deg,var(--neon-blue),var(--electric-purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.login-logo .sub{font-size:0.8rem;color:var(--text-secondary);margin-top:6px;}
.login-logo .icon{font-size:3rem;margin-bottom:8px;display:block;}
.tab-switcher{display:flex;gap:4px;background:rgba(0,0,0,0.4);padding:4px;border-radius:12px;margin-bottom:28px;}
.tab-switch-btn{flex:1;padding:10px;border:none;background:none;color:var(--text-secondary);cursor:pointer;border-radius:8px;font-size:0.85rem;font-family:'Inter',sans-serif;transition:all 0.2s;}
.tab-switch-btn.active{background:rgba(0,212,255,0.15);color:var(--neon-blue);border:1px solid rgba(0,212,255,0.25);}
.form-panel{display:none;}
.form-panel.active{display:block;}
.login-form-group{margin-bottom:16px;}
.login-label{display:block;font-size:0.78rem;color:var(--text-secondary);margin-bottom:6px;letter-spacing:0.05em;}
.login-input{width:100%;background:rgba(0,212,255,0.05);border:1px solid var(--glass-border);color:var(--text-primary);padding:12px 16px;border-radius:10px;font-size:0.88rem;outline:none;transition:all 0.2s;font-family:'Inter',sans-serif;}
.login-input:focus{border-color:var(--neon-blue);background:rgba(0,212,255,0.08);box-shadow:0 0 0 3px rgba(0,212,255,0.1);}
.login-input::placeholder{color:rgba(122,155,192,0.5);}
.btn-login{width:100%;background:linear-gradient(135deg,var(--neon-blue),var(--electric-purple));border:none;color:#fff;padding:13px;border-radius:10px;cursor:pointer;font-weight:600;font-size:0.92rem;transition:all 0.3s;margin-top:8px;font-family:'Inter',sans-serif;letter-spacing:0.05em;}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 10px 40px rgba(0,212,255,0.4);}
.btn-login:active{transform:translateY(0);}
.demo-hint{margin-top:20px;padding:12px 16px;border-radius:10px;background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.15);font-size:0.78rem;color:var(--text-secondary);text-align:center;}
.demo-hint strong{color:var(--neon-blue);}
.error-msg{background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.3);color:#ff4757;padding:10px 14px;border-radius:8px;font-size:0.8rem;margin-bottom:14px;display:none;}
.success-msg{background:rgba(6,255,165,0.1);border:1px solid rgba(6,255,165,0.3);color:var(--neon-green);padding:10px 14px;border-radius:8px;font-size:0.8rem;margin-bottom:14px;display:none;}
.grid-orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;}
.orb1{width:400px;height:400px;background:rgba(0,212,255,0.04);top:-100px;left:-100px;}
.orb2{width:300px;height:300px;background:rgba(139,92,246,0.04);bottom:-80px;right:-80px;}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="login-page">
  <div class="login-bg">
    <div class="grid-orb orb1"></div>
    <div class="grid-orb orb2"></div>
  </div>
  <div class="login-card fade-in">
    <div class="login-logo">
      <span class="icon">🚗</span>
      <div class="brand">VMPS</div>
      <div class="sub">Vehicle Maintenance Prediction System</div>
    </div>

    <div class="tab-switcher">
      <button class="tab-switch-btn active" id="btn-login-tab" onclick="switchTab('login')">Sign In</button>
      <button class="tab-switch-btn" id="btn-signup-tab" onclick="switchTab('signup')">Create Account</button>
    </div>

    <!-- LOGIN -->
    <div class="form-panel active" id="panel-login">
      <div id="login-error" class="error-msg"></div>
      <div class="login-form-group">
        <label class="login-label" for="login-email">Email Address</label>
        <input class="login-input" id="login-email" type="email" placeholder="admin@vmps.ai" autocomplete="email"/>
      </div>
      <div class="login-form-group">
        <label class="login-label" for="login-password">Password</label>
        <input class="login-input" id="login-password" type="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="btn-login" id="btn-login" onclick="doLogin()">Sign In →</button>
      <div class="demo-hint">
        Demo: <strong>admin@vmps.ai</strong> / <strong>admin123</strong>
      </div>
    </div>

    <!-- SIGNUP -->
    <div class="form-panel" id="panel-signup">
      <div id="signup-error" class="error-msg"></div>
      <div id="signup-success" class="success-msg"></div>
      <div class="login-form-group">
        <label class="login-label" for="signup-username">Username</label>
        <input class="login-input" id="signup-username" type="text" placeholder="Your name"/>
      </div>
      <div class="login-form-group">
        <label class="login-label" for="signup-email">Email Address</label>
        <input class="login-input" id="signup-email" type="email" placeholder="you@example.com"/>
      </div>
      <div class="login-form-group">
        <label class="login-label" for="signup-password">Password</label>
        <input class="login-input" id="signup-password" type="password" placeholder="Min 6 characters"/>
      </div>
      <button class="btn-login" id="btn-signup" onclick="doSignup()">Create Account →</button>
    </div>
  </div>
</div>

<script src="/static/js/particles.js"></script>
<script>
function switchTab(tab) {
  document.getElementById('panel-login').classList.toggle('active', tab === 'login');
  document.getElementById('panel-signup').classList.toggle('active', tab === 'signup');
  document.getElementById('btn-login-tab').classList.toggle('active', tab === 'login');
  document.getElementById('btn-signup-tab').classList.toggle('active', tab === 'signup');
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError(id) {
  document.getElementById(id).style.display = 'none';
}

async function doLogin() {
  hideError('login-error');
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) { showError('login-error', 'Please fill in all fields.'); return; }
  const btn = document.getElementById('btn-login');
  btn.textContent = 'Authenticating...'; btn.disabled = true;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password}), credentials: 'include'
    });
    const data = await res.json();
    if (res.ok) { window.location.href = '/'; }
    else { showError('login-error', data.error || 'Login failed'); btn.textContent = 'Sign In →'; btn.disabled = false; }
  } catch(e) { showError('login-error', 'Connection error.'); btn.textContent = 'Sign In →'; btn.disabled = false; }
}

async function doSignup() {
  hideError('signup-error');
  document.getElementById('signup-success').style.display = 'none';
  const username = document.getElementById('signup-username').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  if (!username || !email || !password) { showError('signup-error', 'All fields are required.'); return; }
  if (password.length < 6) { showError('signup-error', 'Password must be at least 6 characters.'); return; }
  const btn = document.getElementById('btn-signup');
  btn.textContent = 'Creating account...'; btn.disabled = true;
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username, email, password}), credentials: 'include'
    });
    const data = await res.json();
    if (res.ok) { window.location.href = '/'; }
    else { showError('signup-error', data.error || 'Registration failed'); btn.textContent = 'Create Account →'; btn.disabled = false; }
  } catch(e) { showError('signup-error', 'Connection error.'); btn.textContent = 'Create Account →'; btn.disabled = false; }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('panel-login').classList.contains('active')) doLogin();
    else doSignup();
  }
});
</script>
</body>
</html>
